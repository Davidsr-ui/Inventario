<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventario Vehículos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: #F4F6F9;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar{
            background: #03045E;
            padding: 18px 0;
        }

        .navbar-brand{
            color: white !important;
            font-size: 35px;
            font-weight: bold;
        }

        .nav-link{
            color: white !important;
            font-weight: 600;
            transition: 0.3s;
            font-size: 18px;
        }

        .nav-link:hover{
            color: #48CAE4 !important;
        }

        /* CONTENIDO */

        .contenido{
            flex: 1;
        }

        /* TITULOS */

        h1,h2,h3{
            color: #03045E;
            font-weight: bold;
        }

        /* CARDS */

        .card{
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover{

    transform: translateY(-10px) scale(1.02);

    transition: 0.4s;

    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);

}

        .card img{
            object-fit: cover;
        }

        /* BOTONES */

        .btn{
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary{
            background: #0077B6;
            border: none;
        }

        .btn-primary:hover{
            background: #0096C7;
        }

        .btn-warning{
            color: white;
        }

        /* FORMULARIOS */

        form p{
            margin-bottom: 20px;
        }

        form label{
            font-weight: bold;
            margin-bottom: 8px;
            color: #03045E;
        }

        form input,
        form textarea,
        form select{

            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #CED4DA;
            outline: none;
            transition: 0.3s;
            margin-top: 5px;
        }

        form input:focus,
        form textarea:focus,
        form select:focus{

            border-color: #0096C7;
            box-shadow: 0px 0px 10px rgba(0,150,199,0.3);

        }

        /* FOOTER */

        footer{
            background: #03045E;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="bi bi-car-front-fill"></i>
            DDSR
        </a>

        <div class="d-flex gap-4">

    <a class="nav-link" href="/">
        <i class="bi bi-house-door-fill"></i>
        Inicio
    </a>

    <a class="nav-link" href="/vehiculos/">
        <i class="bi bi-car-front-fill"></i>
        Vehículos
    </a>

    <a class="nav-link" href="/tipos/">
        <i class="bi bi-grid-fill"></i>
        Tipos
    </a>

</div>

    </div>

</nav>

<!-- CONTENIDO -->

<div class="container mt-5 contenido">

    {% block content %}

    {% endblock %}

</div>

<!-- FOOTER -->

<footer>

    <p class="mb-0">

        <i class="bi bi-code-slash"></i>

        Telefono: 910491787
        direccion: Av. trujillo 123
        Ciudad: Trujillo
        correo:david@gmail.com

    </p>

</footer>

</body>

</html>
