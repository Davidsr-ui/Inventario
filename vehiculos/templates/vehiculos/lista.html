{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    Lista de Vehículos
</h1>

<a href="/vehiculos/crear/" class="btn btn-primary mb-4">

    <i class="bi bi-plus-circle-fill"></i>

    Nuevo Vehículo

</a>

<div class="row">

    {% for v in vehiculos %}

    <div class="col-md-4 mb-4">

        <div class="card h-100 shadow-lg">

            <div class="position-relative">

                <img src="{{ v.imagen.url }}"
                     class="card-img-top"
                     height="250">

                <span class="badge bg-primary position-absolute top-0 end-0 m-3 p-2">

                    <i class="bi bi-car-front-fill"></i>

                    {{ v.tipo }}

                </span>

            </div>

            <div class="card-body">

                <h3 class="fw-bold text-primary">

                    {{ v.marca }} {{ v.modelo }}

                </h3>

                <hr>

                <p class="card-text">

                    <i class="bi bi-calendar-event-fill text-primary"></i>

                    <strong>Año:</strong>

                    {{ v.anio }}

                </p>

                <p class="card-text">

                    <i class="bi bi-cash-stack text-success"></i>

                    <strong>Precio:</strong>

                    S/. {{ v.precio }}

                </p>

                <p class="card-text">

                    <i class="bi bi-grid-fill text-info"></i>

                    <strong>Tipo:</strong>

                    {{ v.tipo }}

                </p>

                <div class="d-flex gap-2 mt-4">

                    <a href="/vehiculos/editar/{{ v.id }}/"
                       class="btn btn-success w-50">
                       

                        <i class="bi bi-pencil-square"></i>

                    </a>

                    <a href="/vehiculos/eliminar/{{ v.id }}/"
                       class="btn btn-danger w-50">

                        <i class="bi bi-trash-fill"></i>

                    </a>

                </div>

            </div>

        </div>

    </div>

    {% empty %}

    <h3>No hay vehículos registrados</h3>

    {% endfor %}

</div>

{% endblock %}
