{% extends 'base.html' %}

{% block content %}

<div class="hero">
    <h1 class="display-4 fw-bold">
        Inventario de Vehículos
    </h1>

    <p class="mt-3">
        Bienvenidos
    </p>
</div>

<div class="row">

    {% for v in vehiculos %}

   <div class="col-md-4 mb-4">

    <div class="card h-100 shadow-lg">

        <div class="position-relative">

            <img src="{{ v.imagen.url }}"
                 class="card-img-top"
                 height="250">

            <span class="badge bg-primary position-absolute top-0 end-0 m-3 p-2">

                <i class="bi bi-car-front-fill"></i>
                {{ v.tipo }}

            </span>

        </div>

        <div class="card-body">

            <h3 class="fw-bold text-primary">

                {{ v.marca }} {{ v.modelo }}

            </h3>

            <hr>

            <p class="card-text">

                <i class="bi bi-calendar-event-fill text-primary"></i>

                <strong>Año:</strong>

                {{ v.anio }}

            </p>

            <p class="card-text">

                <i class="bi bi-cash-stack text-success"></i>

                <strong>Precio:</strong>

                S/. {{ v.precio }}

            </p>

            <p class="card-text">

                <i class="bi bi-grid-fill text-info"></i>

                <strong>Tipo:</strong>

                {{ v.tipo }}

            </p>

        </div>

    </div>

</div>

    {% endfor %}

</div>

{% endblock %}
